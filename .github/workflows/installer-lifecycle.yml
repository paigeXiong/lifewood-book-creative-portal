name: Windows installer lifecycle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['installer/**', 'scripts/*installer*', 'scripts/*msi*', '.github/workflows/installer-lifecycle.yml']
  pull_request:
    paths: ['installer/**', 'scripts/*installer*', 'scripts/*msi*', '.github/workflows/installer-lifecycle.yml']

permissions:
  contents: read

jobs:
  windows-service:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npm run build:web
      - run: npm run build:admin
      - name: Build two test versions of this commit
        shell: powershell
        run: |
          # Same source, different MSI versions: this tests Windows Installer transactions,
          # not database migration compatibility with an older release.
          $version = [version](Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version.Build -ge 65535) { throw 'No next MSI patch version available.' }
          $next = '{0}.{1}.{2}' -f $version.Major,$version.Minor,($version.Build + 1)
          ./scripts/build-msi.ps1 -Version $version.ToString() -OutputDirectory artifacts/lifecycle-previous -SkipFrontendBuild
          if ($LASTEXITCODE -ne 0) { throw 'Previous test MSI build failed.' }
          $previousHashes = @{}
          Get-ChildItem artifacts/lifecycle-previous -Recurse -Filter '*.msi' | ForEach-Object {
            $previousHashes[$_.FullName] = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
          }
          ./scripts/build-msi.ps1 -Version $next -OutputDirectory artifacts/lifecycle-current -SkipFrontendBuild
          if ($LASTEXITCODE -ne 0) { throw 'Current test MSI build failed.' }
          foreach ($path in $previousHashes.Keys) {
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $previousHashes[$path]) {
              throw 'Building the next version changed a previous MSI package.'
            }
          }
      - name: Exercise real service install, cross-language upgrade and reinstall
        shell: powershell
        env:
          LIFEWOOD_ALLOW_DESTRUCTIVE_INSTALLER_TEST: '1'
        run: |
          $previous = @(Get-ChildItem artifacts/lifecycle-previous/zh-CN -Filter '*.msi')
          $current = @(Get-ChildItem artifacts/lifecycle-current/en-US -Filter '*.msi')
          if ($previous.Count -ne 1 -or $current.Count -ne 1) { throw 'Expected exactly one MSI per test language.' }
          ./scripts/test-msi-lifecycle.ps1 -PreviousPackage $previous[0].FullName -CurrentPackage $current[0].FullName
      - name: Publish sanitized lifecycle results in the job summary
        if: always()
        shell: powershell
        run: |
          # Use the job log and summary, not artifact storage. Never read private fixture files.
          '## Windows installer lifecycle' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          $reports = @(Get-ChildItem artifacts/installer-lifecycle/*/result.json -File -ErrorAction SilentlyContinue)
          if ($reports.Count -eq 0) {
            'No lifecycle report was produced. Check the preceding failed step.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }
          foreach ($file in $reports) {
            $report = Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json
            $status = if ($report.passed) { 'Passed' } else { 'Failed' }
            "Result: **$status**" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            "Versions: $($report.previousVersion) -> $($report.currentVersion); languages: $($report.previousLanguage) -> $($report.currentLanguage)." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            foreach ($check in $report.checks) { "- $check" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 }
            "Scope: $($report.scope)" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            $report | Select-Object passed,previousVersion,currentVersion,previousLanguage,currentLanguage,checks,scope | ConvertTo-Json -Depth 5 -Compress | Write-Output
          }
